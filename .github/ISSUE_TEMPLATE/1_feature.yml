name: "✨ 기능"
description: 새 기능·모듈 작업
title: "[feat] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        > 브랜치는 `feat/파트-기능` 으로 따고, PR은 `dev` 로 보내요.

  - type: textarea
    id: what
    attributes:
      label: 📝 무엇을 만드나
      placeholder: "예: 손이 판에서 빠진 뒤 settle_frames 동안 안정되면 judge 상태로 넘기는 상태 머신"
    validations:
      required: true

  - type: textarea
    id: interface
    attributes:
      label: 🔌 인터페이스
      description: 함수, 입력 → 출력. 기존 명세와 달라지면 꼭 적기
      render: python
      placeholder: "StateMachine.update(hand_state: HandState, t: float) -> str  # idle / hand_in / settling / judge"

  - type: textarea
    id: ref
    attributes:
      label: 🔗 참고
      placeholder: 관련 이슈, 논문, 노션 링크
