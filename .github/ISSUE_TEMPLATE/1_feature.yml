name: "✨ 기능"
description: 새 기능·모듈 작업
title: "[feat] "
labels: ["feat"]
body:
  - type: markdown
    attributes:
      value: |
        > 브랜치는 `feat/파트-기능` 으로 따고, PR은 `dev` 로 보내요.

  - type: dropdown
    id: module
    attributes:
      label: 🧩 모듈
      options:
        - board (판 인식)
        - hand (손 인식·상태 머신)
        - change (변화 검출)
        - recog (블록 인식)
        - layer (층 판정)
        - verify (판정)
        - ar (2D 오버레이)
        - baselines (HSV·YOLO)
        - app (메인 루프·통합)
        - server (FastAPI)
        - dashboard (Streamlit)
        - experiments / scripts
        - 기타
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: 📝 무엇을 만드나
      placeholder: "예: 손이 판에서 빠진 뒤 settle_frames 동안 안정되면 judge 상태로 넘기는 상태 머신"
    validations:
      required: true

  - type: textarea
    id: interface
    attributes:
      label: 🔌 인터페이스
      description: 함수, 입력 → 출력. 기존 명세와 달라지면 꼭 적기
      render: python
      placeholder: "StateMachine.update(hand_state: HandState, t: float) -> str  # idle / hand_in / settling / judge"

  - type: checkboxes
    id: done
    attributes:
      label: ✅ 완료 조건
      options:
        - label: 영상 파일 하나로 단독 실행되는 데모 (`python -m assembleguide.<모듈>.demo --video x.mp4`)
        - label: 숫자 설정값은 `configs/default.yaml` 에
        - label: 설정으로 끄고 켤 수 있음 (baseline 비교용)
        - label: 모듈 사이 좌표는 판 기준 mm

  - type: textarea
    id: ref
    attributes:
      label: 🔗 참고
      placeholder: 관련 이슈, 논문, 노션 링크
