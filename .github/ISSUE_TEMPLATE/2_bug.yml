name: "🐛 버그"
description: 잘못 동작하는 것 신고
title: "[fix] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 🐛 무슨 문제인가
      placeholder: "예: 마커 2개가 손에 가려지면 판 자세가 튐"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 🔁 재현 방법
      value: |
        1. 실행 명령:
        2. 입력 영상/카메라:
        3. 바꾼 설정값:
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 🎯 기대 동작 vs 실제 동작
      value: |
        - 기대:
        - 실제:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 📋 로그
      description: 에러 메시지나 `results/logs/*.jsonl` 해당 줄
      render: shell

  - type: textarea
    id: screenshot
    attributes:
      label: 📸 스크린샷
      description: 화면 캡처나 GIF를 끌어다 놓으세요

  - type: dropdown
    id: camera
    attributes:
      label: 📷 입력
      options:
        - 노트북 내장 웹캠
        - 휴대폰 영상
        - U20CAM (TOP)
        - U20CAM (TOP + SIDE)
        - 녹화 영상 파일 (D1/D2/D3)

  - type: input
    id: env
    attributes:
      label: 💻 환경
      placeholder: "Windows 11 / Python 3.11"
