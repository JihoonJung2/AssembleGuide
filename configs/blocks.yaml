# 블록 세트. ID 규칙: {색}{짧은변}x{긴변}{형태} (형태: 일반 생략, S 경사)
# w·h 는 위에서 본 바닥 칸 수(듀플로 스터드 16 mm). 판별은 상단 카메라만 쓴다.
# 판 색(초록)과 같은 색, 위에서 봐서 구분 안 되는 블록(아치 등)은 넣지 않는다.
# role: base = 기본 세트 / new = 새 블록 (헤드 학습·설정 조정에 쓰지 않음, 등록만)

blocks:
