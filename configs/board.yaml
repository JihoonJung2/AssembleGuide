# 작업 판 규격 (v2, 듀플로). 인쇄본: python scripts/make_board.py → docs/board/board_a4.pdf
# A4 가로 종이 + 모서리 ArUco 마커 4개 + 가운데 12x6 듀플로 판(초록).
# 듀플로는 일반 레고의 2배 크기: 스터드 간격 16 mm, 블록 높이 19.2 mm.
# A3 는 카메라 높이 30~35 cm 에서 세로가 화면을 넘어서 쓰지 않는다.
#
# 좌표계
#   시트 좌표: 종이 왼쪽 위 = (0,0), x 오른쪽, y 아래, mm. 마커 위치 정의에만 쓴다.
#   판 좌표:   레고판 왼쪽 위 = (0,0), x 오른쪽(12칸 방향), y 아래(6칸 방향), mm.
#              모듈 사이에서 주고받는 좌표는 전부 판 좌표. 블록 위치는 칸(스터드) 단위 정수.

sheet_mm: [297, 210]          # A4 가로

aruco:
  dict: DICT_4X4_50
  marker_mm: 35               # 마커 한 변 (흰 여백 제외)
  # 마커 왼쪽 위 모서리의 시트 좌표. ID 0 왼쪽 위, 1 오른쪽 위, 2 오른쪽 아래, 3 왼쪽 아래
  markers:
    0: [8, 8]
    1: [254, 8]
    2: [254, 167]
    3: [8, 167]

plate:
  studs: [12, 6]              # x 방향 12칸 × y 방향 6칸
  stud_mm: 16.0               # 듀플로
  origin_on_sheet_mm: [52.5, 57.0]    # 판 왼쪽 위 모서리의 시트 좌표 (종이 가운데)
  color: G                    # 판 색과 같은 색 블록은 쓰지 않는다

block_height_mm: 19.2         # 듀플로
